name: 百度搜索快捷跳转
description: 在百度搜索框用前缀快速跳到对应网站搜索：db 豆瓣、zh 知乎、wb 微博、gh GitHub、yt YouTube、bli B站、sp SpankBang、ph Pornhub、wk 维基、gi Google 图片、by Bing，无前缀默认 Google；google.cn 跳到 google.com
author: iBL3ND
dns: {}
url_rewrites:
- match: '^https?://(www|m).baidu.com/s?.*(wd|word)=db+([^&]+)'
  location: 'https://m.douban.com/search?query=$3'
  status_code: 302
- match: '^https?://(www|m).baidu.com/s?.*(wd|word)=([^+]+)+db'
  location: 'https://m.douban.com/search?query=$3'
  status_code: 302
- match: '^https?://(www|m).baidu.com/s?.*(wd|word)=zh+([^&]+)'
