ipv6: false
allow_external_connections: true
vif_only: true
block_quic: true
close_connections_on_policy_change: true
hide_vpn_icon: false
geoip_db_url: https://github.com/xream/geoip/releases/latest/download/ipinfo.country.mmdb
asn_db_url: https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb
proxy_latency_test_url: https://connectivitycheck.gstatic.com/generate_204
direct_latency_test_url: https://www.qq.com
udp_latency_test_url: google.com@8.8.8.8
compat_route: true
dns:
  upstreams:
    PROXY-DNS:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - https://dns.google/dns-query
    iBL3ND-DNS:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  forward:
  - domain_wildcard:
      match: '*'
      value: iBL3ND-DNS
      disabled: false
  proxy_nameservers:
  - PROXY-DNS
policy_groups:
- external:
    name: 机场订阅
    type: select
    urls:
    - 这里添加你的机场订阅链接
    hidden: true
- select:
    name: iBL3ND
    policies:
    - 机场订阅
    flatten: true
    icon: https://iili.io/KBtLXCx.png
    hidden: false
rules:
- rule_set:
    match: https://raw.githubusercontent.com/GMOogway/shadowrocket-rules/master/sr_direct_list.module
    policy: DIRECT
    disabled: false
- rule_set:
    match: https://raw.githubusercontent.com/Rabbit-Spec/Surge/refs/heads/Master/Rules/China.list
    policy: DIRECT
    disabled: false
- rule_set:
    match: https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt
    policy: DIRECT
    disabled: false
- rule_set:
    name: ChinaIPs
    match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/ChinaIPs/ChinaIPs.list
    policy: DIRECT
    disabled: false
- rule_set:
    match: https://raw.githubusercontent.com/Rabbit-Spec/Surge/refs/heads/Master/Rules/ChinaCIDR.list
    policy: DIRECT
    disabled: false
- rule_set:
    name: ChinaIPv6
    match: https://ruleset.skk.moe/List/ip/china_ip_ipv6.conf
    policy: DIRECT
    disabled: false
- rule_set:
    name: 域间路由
    match: https://raw.githubusercontent.com/IBL3ND/rule/refs/heads/main/LAN.list
    policy: DIRECT
    disabled: false
- default:
    policy: iBL3ND
mitm:
  ca_p12: egern.p12
  ca_passphrase: egern
modules:
- url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/Sub_Widget.yaml
  enabled: false
- url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/WeatherWdg.yaml
  enabled: true
- url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/CN_Cal.yaml
  enabled: true
- url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/Oil_Widget.yaml
  enabled: true
- url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/Holiday_Countdown.yaml
  enabled: true
- url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/Egern-YouTube.yaml
  enabled: true
- url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/Telegram.yaml
  env:
    CLIENT: Telegram
  enabled: true
- url: https://ddgksf2013.top/module/ScriptHub.Egern.sgmodule
  enabled: true
- url: https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/surge-loon-to-egern.yaml
  enabled: true
- url: https://raw.githubusercontent.com/QingRex/LoonKissSurge/refs/heads/main/Surge/Official/%E2%AD%90%EF%B8%8F%20BoxJs.official.sgmodule
  enabled: true
- url: https://raw.githubusercontent.com/sub-store-org/Sub-Store/refs/heads/master/config/Egern.yaml
  enabled: true
- url: https://raw.githubusercontent.com/Script-Hub-Org/Script-Hub/refs/heads/main/modules/script-hub.beta.surge.sgmodule
  enabled: true
